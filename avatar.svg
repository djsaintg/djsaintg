<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
 <radialGradient id="bg" cx="50%" cy="45%" r="68%"><stop offset="0" stop-color="#262a40"/><stop offset=".6" stop-color="#1a1b26"/><stop offset="1" stop-color="#0D1117"/></radialGradient>
 <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7DCFFF"/><stop offset=".5" stop-color="#BB9AF7"/><stop offset="1" stop-color="#F7768E"/></linearGradient>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1024" height="1024" fill="url(#bg)"/>
<!-- terminal dots like sponsor.svg -->
<g filter="url(#soft)"><circle cx="372" cy="236" r="15" fill="#F7768E"/><circle cx="420" cy="236" r="15" fill="#E0AF68"/><circle cx="468" cy="236" r="15" fill="#9ECE6A"/></g>
<!-- halo over the monogram -->
<ellipse cx="560" cy="352" rx="150" ry="30" fill="none" stroke="#E0AF68" stroke-width="13" filter="url(#glow)"/>
<!-- prompt + monogram -->
<text x="196" y="610" font-family="Fira Code" font-weight="600" font-size="150" fill="#9ECE6A" opacity=".9" filter="url(#soft)">&gt;</text>
<text x="340" y="640" font-family="Fira Code" font-weight="700" font-size="290" fill="url(#arc)" filter="url(#soft)">SG</text>
<!-- block cursor -->
<rect x="730" y="500" width="72" height="140" rx="6" fill="#9ECE6A" filter="url(#soft)"/>
<!-- waveform -->
<polyline points="196,780 300,780 326,742 352,822 380,716 408,850 436,758 464,806 494,780 524,766 552,818 580,730 610,842 640,758 668,800 694,780 828,780" fill="none" stroke="#BB9AF7" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)" opacity=".95"/>
</svg>
